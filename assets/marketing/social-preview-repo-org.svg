<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Anchor - Repo plus org memory for AI coding agents</title>
  <desc id="desc">Social preview for Anchor showing local repo and org memory from PR history, code, tests, regressions, architecture, and cross-repo impact.</desc>
  <defs>
    <radialGradient id="glow" cx="35%" cy="42%" r="60%">
      <stop offset="0%" stop-color="#5ad7ff" stop-opacity="0.26"/>
      <stop offset="42%" stop-color="#5e6ad2" stop-opacity="0.13"/>
      <stop offset="100%" stop-color="#08090a" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="panel" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#18202a"/>
      <stop offset="100%" stop-color="#0b0d11"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" x2="1">
      <stop offset="0%" stop-color="#6ce5ff"/>
      <stop offset="100%" stop-color="#7c7cff"/>
    </linearGradient>
    <filter id="softShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#000000" flood-opacity="0.36"/>
    </filter>
    <filter id="blueGlow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="1600" height="900" fill="#08090a"/>
  <rect width="1600" height="900" fill="url(#glow)"/>
  <g opacity="0.24">
    <path d="M0 160H1600M0 320H1600M0 480H1600M0 640H1600M0 800H1600M180 0V900M360 0V900M540 0V900M720 0V900M900 0V900M1080 0V900M1260 0V900M1440 0V900" stroke="#ffffff" stroke-width="1"/>
  </g>

  <g transform="translate(92 118)">
    <rect x="0" y="0" width="116" height="116" rx="30" fill="url(#panel)" stroke="#2a3440" filter="url(#softShadow)"/>
    <g transform="translate(26 22)" fill="none" stroke="url(#accent)" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" filter="url(#blueGlow)">
      <path d="M32 4v58"/>
      <path d="M14 24h36"/>
      <circle cx="32" cy="14" r="10"/>
      <path d="M8 48c5 16 13 24 24 24s19-8 24-24"/>
      <path d="M8 48l-4 13 14-4"/>
      <path d="M56 48l4 13-14-4"/>
    </g>
  </g>

  <text x="238" y="174" fill="#f7f8f8" font-family="Inter, SF Pro Display, Segoe UI, Arial, sans-serif" font-size="86" font-weight="760" letter-spacing="-1">Anchor</text>
  <text x="96" y="304" fill="#f7f8f8" font-family="Inter, SF Pro Display, Segoe UI, Arial, sans-serif" font-size="82" font-weight="760" letter-spacing="-1">Repo + Org Memory</text>
  <text x="96" y="390" fill="#8de8ff" font-family="Inter, SF Pro Display, Segoe UI, Arial, sans-serif" font-size="58" font-weight="700">for AI Coding Agents</text>
  <text x="98" y="472" fill="#cfd6df" font-family="Inter, SF Pro Display, Segoe UI, Arial, sans-serif" font-size="31" font-weight="440">PR history, code, tests, regressions, architecture,</text>
  <text x="98" y="518" fill="#cfd6df" font-family="Inter, SF Pro Display, Segoe UI, Arial, sans-serif" font-size="31" font-weight="440">and cross-repo impact. Local-first. No telemetry.</text>

  <g transform="translate(96 640)">
    <rect x="0" y="0" width="204" height="66" rx="18" fill="#101820" stroke="#263443"/>
    <text x="28" y="42" fill="#f5f7f8" font-family="Inter, SF Pro Display, Segoe UI, Arial, sans-serif" font-size="25" font-weight="650">PR history</text>
    <circle cx="166" cy="32" r="10" fill="#58d889"/>
    <rect x="228" y="0" width="150" height="66" rx="18" fill="#101820" stroke="#263443"/>
    <text x="256" y="42" fill="#f5f7f8" font-family="Inter, SF Pro Display, Segoe UI, Arial, sans-serif" font-size="25" font-weight="650">tests</text>
    <circle cx="342" cy="32" r="10" fill="#58d889"/>
    <rect x="402" y="0" width="218" height="66" rx="18" fill="#101820" stroke="#263443"/>
    <text x="430" y="42" fill="#f5f7f8" font-family="Inter, SF Pro Display, Segoe UI, Arial, sans-serif" font-size="25" font-weight="650">regressions</text>
    <circle cx="582" cy="32" r="10" fill="#f6c54a"/>
    <rect x="644" y="0" width="214" height="66" rx="18" fill="#101820" stroke="#263443"/>
    <text x="672" y="42" fill="#f5f7f8" font-family="Inter, SF Pro Display, Segoe UI, Arial, sans-serif" font-size="25" font-weight="650">org impact</text>
    <circle cx="820" cy="32" r="10" fill="#6ce5ff"/>
  </g>

  <g transform="translate(930 126)" filter="url(#softShadow)">
    <rect x="0" y="0" width="522" height="610" rx="34" fill="#0e1117" stroke="#2e3b4b"/>
    <text x="42" y="60" fill="#f7f8f8" font-family="Inter, SF Pro Display, Segoe UI, Arial, sans-serif" font-size="30" font-weight="720">Anchor context</text>
    <circle cx="474" cy="48" r="10" fill="#58d889"/>

    <g transform="translate(38 104)">
      <rect x="0" y="0" width="446" height="102" rx="20" fill="#131b24" stroke="#29394a"/>
      <text x="24" y="36" fill="#8de8ff" font-family="Inter, SF Pro Display, Segoe UI, Arial, sans-serif" font-size="21" font-weight="700">Must know</text>
      <text x="24" y="72" fill="#d7dde5" font-family="Inter, SF Pro Display, Segoe UI, Arial, sans-serif" font-size="21">API contract changed in PR #128</text>
    </g>

    <g transform="translate(38 232)">
      <rect x="0" y="0" width="446" height="102" rx="20" fill="#131b24" stroke="#29394a"/>
      <text x="24" y="36" fill="#f6c54a" font-family="Inter, SF Pro Display, Segoe UI, Arial, sans-serif" font-size="21" font-weight="700">Regression memory</text>
      <text x="24" y="72" fill="#d7dde5" font-family="Inter, SF Pro Display, Segoe UI, Arial, sans-serif" font-size="21">Rollback mentioned access checks</text>
    </g>

    <g transform="translate(38 360)">
      <rect x="0" y="0" width="446" height="102" rx="20" fill="#131b24" stroke="#29394a"/>
      <text x="24" y="36" fill="#9ca3ff" font-family="Inter, SF Pro Display, Segoe UI, Arial, sans-serif" font-size="21" font-weight="700">Cross-repo impact</text>
      <text x="24" y="72" fill="#d7dde5" font-family="Inter, SF Pro Display, Segoe UI, Arial, sans-serif" font-size="21">3 consumers, 4 related tests</text>
    </g>

    <g transform="translate(38 504)">
      <rect x="0" y="0" width="446" height="62" rx="18" fill="#102519" stroke="#2e6b45"/>
      <text x="24" y="39" fill="#dcffe9" font-family="Inter, SF Pro Display, Segoe UI, Arial, sans-serif" font-size="22" font-weight="650">Evidence-backed before edits</text>
    </g>
  </g>

  <g opacity="0.72" stroke="#6ce5ff" stroke-width="3" fill="none">
    <path d="M760 274C830 274 850 210 930 210"/>
    <path d="M800 390C850 390 860 360 930 360"/>
    <path d="M756 526C835 526 852 514 930 514"/>
  </g>
</svg>
