name: Publish npm packages

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/publish-npm.yml"
      - "package.json"
      - "pnpm-lock.yaml"
      - "packages/**"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    name: Publish missing package versions
    runs-on: ubuntu-latest
    if: github.repository == 'pratik7368patil/anchor'
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10.33.2 --activate

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

      - name: Resolve release version
        id: release
        env:
          BEFORE_SHA: ${{ github.event.before }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail

          version="$(
            node <<'NODE'
          const fs = require("node:fs");

          const packages = [
            "packages/core/package.json",
            "packages/mcp-server/package.json",
            "packages/cli/package.json",
          ];
          const versions = packages.map((file) => {
            const json = JSON.parse(fs.readFileSync(file, "utf8"));
            return [file, json.version];
          });
          const unique = [...new Set(versions.map(([, version]) => version))];

          if (unique.length !== 1) {
            console.error("Anchor package versions must match before publishing:");
            for (const [file, version] of versions) {
              console.error(`- ${file}: ${version}`);
            }
            process.exit(1);
          }

          console.log(unique[0]);
          NODE
          )"

          previous_version=""
          changed="false"

          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            changed="true"
          elif [ -n "${BEFORE_SHA:-}" ] && [ "$BEFORE_SHA" != "0000000000000000000000000000000000000000" ]; then
            previous_version="$(
              git show "${BEFORE_SHA}:packages/cli/package.json" 2>/dev/null \
                | node -e 'const fs = require("node:fs"); const input = fs.readFileSync(0, "utf8").trim(); if (input) process.stdout.write(JSON.parse(input).version);' \
                || true
            )"

            if [ -z "$previous_version" ] || [ "$previous_version" != "$version" ]; then
              changed="true"
            fi
          fi

          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=v$version" >> "$GITHUB_OUTPUT"
          echo "changed=$changed" >> "$GITHUB_OUTPUT"

          if [ "$changed" = "true" ]; then
            echo "Release changelog will be created for v$version."
          else
            echo "Package version did not change; release changelog will be skipped."
          fi

      - name: Verify npm authentication
        run: |
          if ! npm whoami; then
            echo "::error::NPM_TOKEN is missing, expired, revoked, or does not have publish access. Create a valid npm automation/access token and update the repository secret named NPM_TOKEN."
            exit 1
          fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish packages that are not on npm yet
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -euo pipefail

          publish_if_missing() {
            local package_name="$1"
            local package_dir="$2"
            local package_version

            package_version="$(node -p "require('./${package_dir}/package.json').version")"

            if npm view "${package_name}@${package_version}" version >/dev/null 2>&1; then
              echo "${package_name}@${package_version} is already published; skipping."
            else
              echo "Publishing ${package_name}@${package_version}..."
              pnpm --filter "${package_name}" publish --access public --no-git-checks
            fi
          }

          publish_if_missing "@pratik7368patil/anchor-core" "packages/core"
          publish_if_missing "@pratik7368patil/anchor-mcp-server" "packages/mcp-server"
          publish_if_missing "@pratik7368patil/anchor" "packages/cli"

      - name: Create GitHub release changelog
        if: steps.release.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
        run: |
          set -euo pipefail

          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "GitHub Release $RELEASE_TAG already exists; skipping."
            exit 0
          fi

          previous_tag="$(
            git tag --list 'v[0-9]*' --sort=-v:refname \
              | grep -v "^${RELEASE_TAG}$" \
              | head -n 1 \
              || true
          )"

          release_args=(
            release create "$RELEASE_TAG"
            --target "$GITHUB_SHA"
            --title "Anchor $RELEASE_VERSION"
            --generate-notes
          )

          if [ -n "$previous_tag" ]; then
            release_args+=(--notes-start-tag "$previous_tag")
          fi

          gh "${release_args[@]}"
